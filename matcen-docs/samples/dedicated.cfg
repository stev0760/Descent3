[server config file]
; Matcen sample dedicated server config. The line above must stay the first line.
; Run it from the Descent 3 folder: ./Descent3 -dedicated ./dedicated.cfg
; One Key=Value per line; comments go on their own line.
;
; Server name shown in the game browser.
GameName=Matcen Bots
; The mission and the game mode. Any multiplayer mission in your missions
; folder works, if it supports the mode. Modes: anarchy.d3m, team anarchy.d3m,
; hyper-anarchy.d3m, robo-anarchy.d3m, ctf.d3m, hoard.d3m, entropy.d3m,
; monsterball.d3m, co-op.d3m. NumTeams (2-4) is for the team modes.
MissionName=bedlam.mn3
Scriptname=ctf.d3m
NumTeams=2
; Minutes per level, then the next level of the mission. 0 = no limit.
TimeLimit=20
KillGoal=0
; Seats: the server's own seat, 12 players (bots.cfg BotTargetPlayers=12)
; and 1 seat kept free for a human (BotReservedSlots=1).
MaxPlayers=14
PPS=40
ConnectionName=Direct TCP~IP
; Remote console (telnet, D3 Pyrodeck). Change the password.
AllowRemoteConsole=1
RemoteConsolePort=2092
ConsolePassword=changeme
; The bot roster and population settings.
BotConfig=bots.cfg
