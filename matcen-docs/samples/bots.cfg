; Matcen sample bot roster, read through BotConfig=bots.cfg in dedicated.cfg.
; One Key=Value per line. Comments go on their own line: a ; after a value
; becomes part of the value.
;
; Bots that join when the server starts.
BotCount=4
; Keep 12 players in the game: bots join as humans leave and leave as humans
; join. 0 (the default) turns this off. With MaxPlayers=14 in dedicated.cfg
; (the server's seat, 12 players, 1 free seat) the game stays full and every
; human replaces a bot; a larger MaxPlayers lets humans outgrow the bots.
; Use an even number in team games, or one team is always a player bigger.
BotTargetPlayers=12
; Seats always left free for humans (default 1, minimum 1).
BotReservedSlots=1
; Difficulty for every bot: trainee, rookie, hotshot, ace or insane.
BotDifficulty=hotshot
; The roster, up to 16 entries. Names are cut to 14 characters and get [BOT]
; added. Ships: pyro, phoenix, magnum, blackpyro (Black Pyro needs Mercenary).
; BotDifficulty<n> overrides the difficulty for one bot. BotTeam<n> is 1-4 in
; team games; leave it out and the bot joins the smallest team.
; Bots the target adds beyond the roster get built-in names.
BotName1=Reaper
BotShip1=pyro
BotDifficulty1=ace
BotTeam1=1
BotName2=Phantom
BotShip2=phoenix
BotTeam2=2
BotName3=Viper
BotName4=Shadow
